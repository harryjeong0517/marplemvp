<style>
:root {
  --paper: #f2f4f7; --card: #ffffff; --ink: #16191f; --ink2: #4b5563; --ink3: #8a93a3; --line: #e6e8ec; --line2: #f0f1f4;
  --night: #111827; --night2: #1f2937; --marple: #007db8; --sky: #009ddf; --soft: #e3f4fc;
  --red: #e2445c; --red-soft: #fdeaea; --green: #00a862; --green-soft: #e5f6ea; --orange: #f59e0b; --orange-soft: #fff4e0;
  --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
  --tab-h: 62px; --top-h: 52px;
  --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
.kv input[type=date] { min-width: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; font-size: 16px; color: var(--ink); }
a { color: var(--marple); text-decoration: none; }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.hide { display: none !important; }

/* ── 로그인 ── */
.login { min-height: 100vh; min-height: 100dvh; background: var(--night); color: #fff; display: flex; flex-direction: column; padding: calc(56px + var(--st)) 24px calc(28px + var(--sb)); }
.login img { height: 26px; width: auto; align-self: flex-start; }
.login h1 { font-size: 28px; line-height: 1.3; font-weight: 800; letter-spacing: -.02em; margin: 40px 0 8px; }
.login p { color: #9ca3af; margin: 0 0 32px; font-size: 14.5px; }
.login form { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.login input[type=text], .login input[type=password] { background: var(--night2); border: 1px solid #374151; color: #fff; border-radius: var(--r-md); padding: 15px 16px; outline: none; }
.login input:focus { border-color: var(--sky); }
.login label.keep { display: flex; align-items: center; gap: 8px; color: #cbd5e1; font-size: 14px; margin: 4px 2px 8px; }
.login label.keep input { width: 18px; height: 18px; accent-color: var(--sky); }
.login .err { color: #fca5a5; font-size: 13.5px; min-height: 20px; }
.login .sync { font-size: 12.5px; color: #6b7280; text-align: center; margin-top: 14px; }

/* ── 버튼 ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 18px; border-radius: var(--r-md); font-weight: 700; font-size: 15.5px; background: var(--line2); color: var(--ink); }
.btn.pri { background: var(--marple); color: #fff; }
.btn.sky { background: var(--sky); color: #fff; }
.btn.red { background: var(--red-soft); color: var(--red); }
.btn.ghost { background: transparent; color: var(--marple); }
.btn.block { width: 100%; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.btn:active { transform: scale(.98); }

/* ── 앱 틀 ── */
.app { padding-top: calc(var(--top-h) + var(--st)); padding-bottom: calc(var(--tab-h) + var(--sb) + 16px); }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: var(--night); color: #fff; height: calc(var(--top-h) + var(--st)); padding: var(--st) 6px 0 16px; display: flex; align-items: center; gap: 6px; }
.top .logo { height: 17px; width: auto; }
.top .back { width: 40px; height: 40px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.top .back svg { width: 22px; height: 22px; }

/* ── 검색·필터 ── */

/* ── 상세 ── */

.check { display: flex; align-items: flex-start; gap: 12px; padding: 11px 16px; }

.addline { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; }
.addline input { flex: 1; border: 0; outline: none; background: none; min-height: 36px; }
.cm { display: flex; gap: 10px; padding: 12px 16px; }
.cm .body { flex: 1; min-width: 0; }

.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--card); border-top: 1px solid var(--line); padding: 8px 10px calc(8px + var(--sb)); display: flex; gap: 8px; align-items: flex-end; }

.log { font-size: 12.5px; color: var(--ink3); padding: 6px 16px; }

.money { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--card); border-radius: var(--r-lg); }

.acts { display: flex; gap: 8px; }

.contact { padding: 13px 14px 13px 16px; display: flex; gap: 12px; align-items: center; }

.cbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); color: var(--marple); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumbs button { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line2) center/cover no-repeat; position: relative; }
.thumbs button span { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; font-size: 11px; padding: 14px 6px 5px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumbs button b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink2); font-size: 13px; }
.fic { width: 40px; height: 40px; border-radius: 10px; color: #fff; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 700; flex-shrink: 0; }

.noti { padding: 13px 16px; display: flex; gap: 12px; width: 100%; text-align: left; }

/* ── 시트 ── */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(17,24,39,.45); opacity: 0; transition: opacity .2s; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--card); border-radius: 22px 22px 0 0; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); padding-bottom: var(--sb); }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #d5d9e0; margin: 8px auto 4px; flex-shrink: 0; }
.sheet .sh { display: flex; align-items: center; padding: 6px 12px 10px 20px; flex-shrink: 0; }
.sheet .sh h3 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; }
.sheet .sh button { width: 36px; height: 36px; border-radius: 50%; background: var(--line2); color: var(--ink2); display: flex; align-items: center; justify-content: center; }
.sheet .sb { overflow-y: auto; padding: 4px 20px 20px; -webkit-overflow-scrolling: touch; }

.stopts { display: flex; flex-direction: column; gap: 8px; }
.stopts button { height: 54px; border-radius: 14px; color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--st); }

.fld input:not([type=checkbox]):not([type=file]), .fld select, .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; background: var(--card); outline: none; -webkit-appearance: none; appearance: none; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--sky); }
.fld textarea { resize: vertical; min-height: 84px; }
.fld .hint { font-size: 12.5px; color: var(--ink3); margin-top: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.amount { font-size: 26px !important; font-weight: 800; letter-spacing: -.01em; text-align: right; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.picks button { height: 38px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }

.photo { border: 1.5px dashed #c7cdd8; border-radius: var(--r-md); min-height: 120px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: var(--ink3); font-size: 14px; position: relative; overflow: hidden; }

/* ── 미리보기 ── */
.pv { position: fixed; inset: 0; z-index: 80; background: #0b1220; display: flex; flex-direction: column; }

.pv .ph h4 { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv .ph button, .pv .ph a { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 10px; color: #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 700; }
.pv .ph svg { width: 22px; height: 22px; }

.pv .ld { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #cbd5e1; font-size: 14px; pointer-events: none; }
.pv .ld i, .spin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; animation: spin .8s linear infinite; }

@media (max-width: 640px) {
  .ch-pop, .ch-pop.at { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: 100%; border-radius: 20px 20px 0 0; transform: translateY(100%); max-height: 85vh; padding-bottom: env(safe-area-inset-bottom, 0); }

}

/* 새 메시지 알림 카드 */
.ch-toast { position: fixed; z-index: 9995; right: 20px; bottom: 90px; width: 320px; background: #111827; color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 14px 40px rgba(0,0,0,.3); cursor: pointer; transform: translateY(16px); opacity: 0; transition: .2s; font-family: Pretendard, -apple-system, sans-serif; }

/* 알림 카드: 숨겨져 있을 땐 터치를 막지 않게 (모바일 상단 알림 버튼 가려짐 수정) · 닫기 버튼 */

.ch-toast.on { transition: transform .2s, opacity .2s, visibility 0s; }
.ch-toast-x { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 14px; line-height: 30px; text-align: center; cursor: pointer; padding: 0; }

/* ── 마플캘린더 (PC · 모바일 공용) ── */
.cal-grid { background: #fff; border: 1px solid #e6e8ec; border-radius: 14px; overflow: hidden; user-select: none; }

.rn-bulk b { flex: 1; font-size: 14.5px; } .rn-bulk b small { display: block; font-size: 12px; color: #9ca3af; font-weight: 600; }
.rn-bulk button { background: var(--green); color: #fff; border-radius: 11px; height: 42px; padding: 0 14px; font-weight: 800; font-size: 14px; } .rn-bulk button.gray { background: #374151; } .rn-bulk button:disabled { opacity: .5; }
.rn-sbar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--marple); border-radius: 14px; padding: 0 12px; height: 50px; margin-bottom: 12px; }
.rn-sbar svg { width: 20px; height: 20px; color: var(--ink3); flex-shrink: 0; } .rn-sbar input { flex: 1; border: 0; outline: none; background: none; height: 100%; min-width: 0; }
.rn-gl { font-size: 12.5px; font-weight: 800; color: var(--ink3); margin: 12px 4px 6px; }
.rn-chips { display: flex; gap: 6px; flex-wrap: wrap; } .rn-chips button { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink2); }
#rn-res .row .main { cursor: pointer; } #rn-res .row { gap: 10px; }
#rn-fab { position: fixed; right: 16px; bottom: calc(var(--tab-h) + var(--sb) + 14px); z-index: 26; height: 54px; border-radius: 27px; background: var(--marple); color: #fff; display: flex; align-items: center; gap: 6px; padding: 0 18px 0 14px; font-weight: 800; font-size: 15px; box-shadow: 0 8px 20px rgba(0,125,184,.45); transition: padding .2s, width .2s; overflow: hidden; white-space: nowrap; border: 0; font-family: inherit; }
#rn-fab svg { width: 24px; height: 24px; flex-shrink: 0; }
#rn-fab.mini { padding: 0 15px; } #rn-fab.mini span { display: none; }
body.in-room #rn-fab, body.has-composer #rn-fab { display: none !important; }
body:has(.rn-bulk) #rn-fab { display: none !important; }
.rn-qg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rn-qg button { border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; background: var(--card); }
.rn-qg span { font-size: 26px; display: block; } .rn-qg b { display: block; font-size: 15px; margin-top: 6px; } .rn-qg small { font-size: 12px; color: var(--ink3); }
.rn-sigbox { background: var(--card); border-radius: 14px; height: 120px; display: flex; align-items: center; justify-content: center; } .rn-sigbox img { max-height: 100px; max-width: 90%; }
#rn-pad { width: 100%; aspect-ratio: 660/260; background: #fff; border: 2px dashed #c0c6d0; border-radius: 14px; touch-action: none; display: block; }
.rn-live-wrap { margin-top: 14px; } .rn-live-wrap .rn-live:last-child { margin-bottom: 0; }
/* ═══ 새 홈 ═══ */
.rnh-hero{background:radial-gradient(500px 200px at 100% 0,#0ea5e9 0,transparent 60%),linear-gradient(160deg,#0b1220,#16233d 60%,#0b4a6f);color:#fff;padding:18px 20px 64px;margin:-16px -16px 0;position:relative;overflow:hidden}
.rnh-hero:after{content:"";position:absolute;right:-50px;top:-30px;width:180px;height:180px;border:22px solid rgba(0,157,223,.18);border-radius:50%}
.rnh-hero small{color:#9fb3c8;font-size:13px;font-weight:600}
.rnh-hero h1{font-size:23px;font-weight:800;margin:4px 0 0;line-height:1.35;color:#fff}
.rnh-hero h1 b{color:#7dd3fc}
.rnh-body{margin-top:-46px;position:relative;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.rnh-glance{background:#fff;border-radius:20px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 10px 24px rgba(15,23,42,.08)}
.rnh-glance button{border:0;background:none;text-align:center;padding:10px 0;font-family:inherit;color:inherit}
.rnh-glance b{display:block;font-size:20px;font-weight:900}
.rnh-glance small{font-size:11px;color:#8a93a3;font-weight:600}
.rnh-glance .r b{color:#e2445c}
.rnh-body .rn-live{margin:0}
.rnh-card{background:#fff;border-radius:18px;padding:12px 14px}
.rnh-card .ch{display:flex;font-size:14.5px;font-weight:800;margin-bottom:4px}
.rnh-card .ch a{margin-left:auto;font-size:12px;color:#007db8;font-weight:700}
.rnh-tr{display:flex;gap:10px;align-items:center;padding:9px 0;border:0;border-bottom:1px solid #f2f4f7;background:none;width:100%;text-align:left;font-family:inherit;color:inherit}
.rnh-tr:last-child{border-bottom:0}
.rnh-tr time{width:42px;flex-shrink:0;font-size:12px;font-weight:800;color:#007db8}
.rnh-tr div{flex:1;min-width:0}
.rnh-tr b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnh-tr small{font-size:11.5px;color:#8a93a3}
.rnh-tr em{font-style:normal;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;flex-shrink:0}
.rnh-hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -14px 0;padding:2px 14px 4px;scrollbar-width:none}
.rnh-hs::-webkit-scrollbar{display:none}
.rnh-ev{flex:0 0 170px;scroll-snap-align:start;border:0;border-radius:16px;padding:12px;color:#fff;min-height:96px;position:relative;text-align:left;font-family:inherit;display:flex;flex-direction:column}
.rnh-ev small{font-size:11px;opacity:.85;font-weight:700;padding-right:44px}
.rnh-ev b{display:block;font-size:14px;margin-top:4px;line-height:1.3}
.rnh-ev span{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.22);border-radius:7px;padding:1px 7px;font-size:11px;font-weight:900}

</style>

// ════════════════════════════════════════════
//  결재 라인 지정 — 팀별 팀장 · 본부별 본부장 (PC · 모바일 공용)
//  DB.teams[].leadId  /  DB.depts[].headId  (관리자가 지정)
//  지정이 있으면: 알림·메일은 그 사람에게만, 결재도 그 사람만 (대표는 그대로)
// ════════════════════════════════════════════
function aprActive(role) { return (DB.users || []).filter(function (u) { return u.status === 'active' && (!role || u.approvalRole === role); }); }
function aprUserById(id) { return id ? (DB.users || []).find(function (u) { return u.id === id && u.status === 'active'; }) || null : null; }
function aprTeamObj(name) { return (DB.teams || []).find(function (t) { return t.name === name; }) || null; }
function aprDeptOfTeam(name) {
  name = String(name || ''); var ds = DB.depts || [];
  if (name.indexOf('@dept:') === 0) { var id = name.slice(6); return ds.find(function (d) { return d.id === id; }) || null; }
  var t = aprTeamObj(name); if (t) return ds.find(function (d) { return d.id === t.deptId; }) || null;
  return name ? ds.find(function (d) { return d.name === name; }) || null : null; // 팀 칸에 본부 이름이 들어간 경우
}
// 사람의 본부: 팀 → 그 팀의 본부, 팀이 없으면 직접 지정한 본부(deptId)
function aprUserDept(u) { if (!u) return null; return aprDeptOfTeam(u.team) || (u.deptId ? (DB.depts || []).find(function (d) { return d.id === u.deptId; }) || null : null); }
function aprTeamName(pay, p) {
  var cu = pay && (DB.users || []).find(function (u) { return u.name === pay.createdBy; });
  if (cu && cu.team) return cu.team;
  if (cu && cu.deptId) return '@dept:' + cu.deptId;
  return (p && p.team) || '';
}
// 지정된 사람 (없으면 null)
function aprMapped(role, team) {
  if (role === 'teamLead') { var t = aprTeamObj(team); return t ? aprUserById(t.leadId) : null; }
  if (role === 'deptHead') { var d = aprDeptOfTeam(team); return d ? aprUserById(d.headId) : null; }
  return null;
}
// 알림 받을 사람: 지정 → 같은 팀/본부 → 전체
function aprUsersFor(role, team) {
  var m = aprMapped(role, team); if (m) return [m];
  var act = aprActive(role);
  if (role === 'teamLead') { var mine = act.filter(function (u) { return u.team === team; }); return mine.length ? mine : act; }
  if (role === 'deptHead') {
    var d = aprDeptOfTeam(team);
    if (d) { var same = act.filter(function (u) { var dd = aprUserDept(u); return dd && dd.id === d.id; }); if (same.length) return same; }
    return act;
  }
  return act;
}
function aprUsers(role, pay, p) { return aprUsersFor(role, aprTeamName(pay, p)); }
// 이 사람이 이 페이먼트를 결재하면 안 되는지 (알림 받는 사람 = 결재할 수 있는 사람)
function aprBlocked(user, pay, p) {
  if (!user || !user.approvalRole || user.approvalRole === 'ceo') return false;
  var team = aprTeamName(pay, p);
  return !aprUsersFor(user.approvalRole, team).some(function (u) { return u.id === user.id; });
}
function aprFindPay(approval) {
  var hit = null;
  (DB.projects || []).some(function (p) { return (p.payments || []).concat(p.groupPayments || []).some(function (x) { if (x.approval === approval) { hit = { p: p, pay: x }; return true; } }); });
  return hit;
}
// 팀 결재 라인 요약 (관리 화면 · 미리보기)
function aprLineText(team) {
  var nm = function (l) { return l.length ? l.map(function (u) { return u.name; }).join(', ') : '없음'; };
  var tl = aprMapped('teamLead', team), dh = aprMapped('deptHead', team);
  return [
    { role: '팀장', who: tl ? tl.name : nm(aprUsersFor('teamLead', team)), set: !!tl },
    { role: '본부장', who: dh ? dh.name : nm(aprUsersFor('deptHead', team)), set: !!dh },
    { role: '대표', who: nm(aprActive('ceo')), set: true }

}

// ════════════════════════════════════════════
//  모바일 페이먼트 결재함 — 밖에서도 승인 · 반려 · 결재 요청 · 반려 요청 처리
//  (규칙은 PC ERP와 같음: 팀장 → 본부장 → 대표, 전결, 작성 중 → 결재 요청, 승인 후 잠금)
// ════════════════════════════════════════════
var MP_AUTH = { ceo: ['teamLead', 'deptHead', 'ceo'], deptHead: ['teamLead', 'deptHead'], teamLead: ['teamLead'] };
var mpUI = { tab: '' };
function mpStep(a) { if (!a) return 'teamLead'; for (var i = 0; i < 3; i++) { var r = APPROVAL_ORDER[i]; if (a[r] && a[r].status === 'rejected') return r; } for (i = 0; i < 3; i++) { r = APPROVAL_ORDER[i]; if (!a[r] || a[r].status !== 'approved') return r; } return 'done'; }
function mpRej(a) { return !!a && APPROVAL_ORDER.some(function (r) { return a[r] && a[r].status === 'rejected'; }); }
function mpRejRole(a) { return APPROVAL_ORDER.find(function (r) { return a && a[r] && a[r].status === 'rejected'; }) || null; }
function mpApproved(pay) { return !!(pay && pay.approval && APPROVAL_ORDER.some(function (r) { return pay.approval[r] && pay.approval[r].status === 'approved'; })); }

function mpTop(pay) { var t = null; APPROVAL_ORDER.forEach(function (r) { if (pay.approval && pay.approval[r] && pay.approval[r].status === 'approved') t = r; }); return t; }
function mpCanAct(pay) { if (!me || !me.approvalRole || !pay || pay.draft || !pay.approval || mpRej(pay.approval)) return false; var s = mpStep(pay.approval); if (s === 'done' || (MP_AUTH[me.approvalRole] || []).indexOf(s) < 0) return false; var f = aprFindPay(pay.approval); return !(f && aprBlocked(me, pay, f.p)); }
function mpCanUnlock(pay) { if (!me || !pay) return false; if (me.role === 'admin') return true; var t = mpTop(pay); if (!t || (MP_AUTH[me.approvalRole] || []).indexOf(t) < 0) return false; var f = aprFindPay(pay.approval); return !(f && aprBlocked(me, pay, f.p)); }
function mpMine(pay) { return !pay.createdBy || pay.createdBy === me.name || me.role === 'admin'; }
function mpLabel(pay) {
  if (pay.draft) return ['작성 중', 'mid'];
  var a = pay.approval || {};
  if (mpRej(a)) return [APPROVAL_LABELS[mpRejRole(a)] + ' 반려', 'no'];
  var s = mpStep(a); if (s === 'done') return [pay.depositConfirmed ? '입금 완료' : '결재 완료', 'ok'];
  return [APPROVAL_LABELS[s] + ' 결재 대기', 'wait'];

// 모든 페이먼트 (단일 + 그룹)
function mpAll() {
  var out = [];
  (DB.projects || []).forEach(function (p) {
    (p.payments || []).forEach(function (x) { out.push({ p: p, pay: x, key: 'i:' + x.itemId, gp: '' }); });
    (p.groupPayments || []).forEach(function (x) { out.push({ p: p, pay: x, key: 'g:' + x.id, gp: x.id }); });
  });
  return out;
}
function mpFind(pid, key) { var p = pjOf(pid); if (!p) return null; var k = key.slice(2), pay = key[0] === 'g' ? (p.groupPayments || []).find(function (x) { return x.id === k; }) : (p.payments || []).find(function (x) { return x.itemId === k; }); return pay ? { p: p, pay: pay, key: key, gp: key[0] === 'g' ? k : '' } : null; }
function mpItemName(p, pay) { if (pay.itemIds) return pay.itemIds.map(function (id) { var i = (p.items || []).find(function (x) { return x.id === id; }); return i ? i.name : ''; }).filter(Boolean).join(', '); var it = (p.items || []).find(function (x) { return x.id === pay.itemId; }); return it ? it.name : ''; }
function mpMyTurn() { return mpAll().filter(function (x) { return mpCanAct(x.pay); }); }
function mpUnlockReqs() { return mpAll().filter(function (x) { return x.pay.unlockReq && !x.pay.unlockReq.done && mpLocked(x.pay) && mpCanUnlock(x.pay); }); }
function mpBadgeCount() { return me ? mpMyTurn().length + mpUnlockReqs().length : 0; }

function mpEmail(u) { if (!u) return ''; if (u.email) return u.email; var t = (V.team || []).find(function (x) { return x.name === u.name && x.email; }); return t ? t.email : ''; }
function mpRoleUsers(role, pay, p) { return aprUsers(role, pay, p); }
function mpRows(p, pay) { return [['프로젝트', (p.code ? p.code + ' ' : '') + p.name], ['항목', mpItemName(p, pay)], ['업체', pay.company || ''], ['지급액', won(pay.received) + ' (공급가 ' + won(pay.baseAmount) + ')'], ['작성자', pay.createdBy || '']]; }

// ── 화면: 페이먼트 상세 ──
function vPayD(pid, key) {
  var x = mpFind(pid, key); if (!x) return { title: '페이먼트', html: '<div class="empty"><b>페이먼트를 찾을 수 없어요</b>지워졌거나 바뀌었어요.</div>' };
  var p = x.p, pay = x.pay, a = pay.approval || {}, l = mpLabel(pay), step = mpStep(a);

  var html = '<div class="dhead">' + (p.code ? '<span class="code">' + esc(p.code) + '</span> ' : '') + '<span class="badge ' + l[1] + '">' + l[0] + '</span><h1>' + esc(pay.company || '(업체 미입력)') + '</h1><div class="sub">' + esc(p.name) + ' · ' + esc(mpItemName(p, pay)) + '</div>' +

  if (/html/.test(m) || /\.html?$/.test(n)) return ['</>', '#0f766e']; if (/\.(pptx?|key)$/.test(n)) return ['PPT', '#f59e0b'];
  if (/\.(xlsx?|csv)$/.test(n)) return ['XLS', '#00a862']; if (/\.(docx?|hwp|hwpx)$/.test(n)) return ['DOC', '#579bfc'];
  if (/\.(zip|rar|7z)$/.test(n)) return ['ZIP', '#7d8796']; if (/video\//.test(m)) return ['▶', '#0ea5a4'];
  return ['FILE', '#9aa3af'];
}

var SHEET = { open: false };
function openSheet(title, body, foot) {
  closeSheet(true);

  var d = document.createElement('div'); d.className = 'sheet'; d.id = 'sheet'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  d.innerHTML = '<div class="grab"></div><div class="sh"><h3>' + esc(title) + '</h3><button onclick="closeSheet()" aria-label="닫기">' + IC.x + '</button></div><div class="sb">' + body + '</div>' + (foot ? '<div class="sf">' + foot + '</div>' : '');
  document.body.appendChild(s); document.body.appendChild(d);
  requestAnimationFrame(function () { s.classList.add('on'); d.classList.add('on'); });
  SHEET.open = true;
  history.pushState({ sheet: 1 }, '');
  // 아래로 끌어서 닫기
  var y0 = null, grab = d.querySelector('.grab'), sh = d.querySelector('.sh');
  [grab, sh].forEach(function (el) {
    el.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; d.style.transition = 'none'; }, { passive: true });
    el.addEventListener('touchmove', function (e) { if (y0 == null) return; var dy = Math.max(0, e.touches[0].clientY - y0); d.style.transform = 'translateY(' + dy + 'px)'; }, { passive: true });
    el.addEventListener('touchend', function (e) { if (y0 == null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null; d.style.transition = ''; d.style.transform = ''; if (dy > 90) closeSheet(); });
  });
}
function closeSheet(silent) {

  if (d) { d.classList.remove('on'); d.id = ''; setTimeout(function () { d.remove(); }, 260); }
  if (s) { s.classList.remove('on'); s.id = ''; setTimeout(function () { s.remove(); }, 260); }

  if (M._pendingRender) { M._pendingRender = false; setTimeout(render, 280); }
}

function aprLblText(html, L) {
